apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent-todo.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "agent-todo.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "agent-todo.name" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "agent-todo.name" . }}
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-todo.fullname" . }}-secrets
                  key: databaseUrl
            - name: DATABASE_REPLICA_URLS
              valueFrom:
                secretKeyRef:
                  name: {{ include "agent-todo.fullname" . }}-secrets
                  key: databaseReplicaUrls
                  optional: true
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
