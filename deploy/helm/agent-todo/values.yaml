replicaCount: 2

image:
  repository: agent-todo
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  host: agent-todo.example.com
  tls: true

env:
  PUBLIC_URL: https://agent-todo.example.com
  JOBS_ENABLED: "true"
  # DATABASE_URL and DATABASE_REPLICA_URLS via secrets

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

pdb:
  minAvailable: 1
